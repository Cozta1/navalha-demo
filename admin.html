<style>
  /* o admin usa o cobre do Marcaí como cor de destaque */
  :root { --blue: #c8703f; --on-accent: #1e1009; }
  body.cliente .btn-blue { background: linear-gradient(135deg, #b5602f 0%, #e09a63 35%, #f3c39b 50%, #d27b45 65%, #b5602f 100%); background-size: 180% auto; }
  .topo-adm { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  .topo-adm .wrap { display: flex; align-items: center; justify-content: space-between; height: 68px; gap: 12px; }
  .logo-n { display: inline-flex; align-items: center; gap: 10px; font-family: var(--serif); font-size: 1.4rem; font-weight: 600; letter-spacing: -.03em; color: var(--text); }
  .logo-n svg { width: 30px; height: 30px; }
  .logo-n small { font-family: var(--sans); font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--blue-light); margin-left: 4px; }
  main.wrap { padding-top: 26px; padding-bottom: 70px; max-width: 1180px; }
  h2 { margin-bottom: 4px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 6px 0 30px; }
  .kpis .card { padding: 18px; }
  .kpis b { display: block; font-family: var(--serif); font-weight: 600; font-size: clamp(1.35rem, 2vw, 2rem); letter-spacing: -.02em; margin-top: 4px; overflow-wrap: anywhere; }
  .kpis .card.destaque { border: 1px solid transparent; background: linear-gradient(var(--card), var(--card)) padding-box, linear-gradient(135deg, #b5602f, #f3c39b, #b5602f) border-box; }
  .tabela { border: 1px solid var(--line); border-radius: 16px; overflow-x: auto; background: var(--card); box-shadow: var(--sombra); }
  .tr { display: grid; grid-template-columns: 2fr 1.1fr .9fr 1fr .7fr .6fr auto; gap: 12px; align-items: center; padding: 14px 18px; border-top: 1px solid var(--line); min-width: 900px; }
  .tr.th { border-top: 0; background: var(--card-2); font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .tr b { font-weight: 600; }
  .tag.teste { background: color-mix(in srgb, #3b82f6 16%, transparent); color: #60a5fa; }
  .tag.ativa { background: color-mix(in srgb, #22c55e 16%, transparent); color: #22c55e; }
  .tag.atrasada { background: color-mix(in srgb, #f59e0b 18%, transparent); color: #d97706; }
  .tag.suspensa, .tag.cancelada { background: color-mix(in srgb, #ef4444 15%, transparent); color: #ef4444; }
  .auth { max-width: 420px; margin: 70px auto; padding: 32px; }
  .filtros { display: flex; gap: 8px; flex-wrap: wrap; }
  .filtros input { max-width: 280px; }
  .filtros select { width: auto; }
  .secao { margin-top: 40px; }
  .plano { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; align-items: end; }
  @media (max-width: 760px) { .plano { grid-template-columns: 1fr 1fr; } }
  .plano-card { padding: 18px; }
  .checks { display: flex; flex-wrap: wrap; gap: 6px; }
  .chk { display: inline-flex; align-items: center; gap: 6px; margin: 0; color: var(--text); background: var(--bg-alt); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; font-size: .88rem; cursor: pointer; }
  .pedido { border-top: 1px solid var(--line); padding: 16px 0 4px; }
  .pedido:first-of-type { border-top: 0; }
  .row-f { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row input.grow, .row-f input.grow { min-width: 0; flex: 1 1 200px; }
  .row:has(> input.grow) { flex-wrap: wrap; }
</style>

  <div class="row"><span id="tema"></span><button class="btn btn-ghost btn-sm hidden" id="sair">Sair</button></div>
</div></header>
